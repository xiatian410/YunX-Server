services:
  yunx:
    image: "${YUNX_IMAGE:-ghcr.io/xiatian410/yunx-server:0.2.0-preview.1}"
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "${BIND_IP:-0.0.0.0}:${PORT:-8080}:8080"
    environment:
      YUNX_PUBLIC_URL: "${PUBLIC_URL:-}"
      YUNX_ALLOW_PRIVATE_DOWNLOADS: "${ALLOW_PRIVATE_DOWNLOADS:-false}"
    volumes:
      - "${DATA_DIR:-./data}:/data"
      - "${DOWNLOAD_DIR:-./downloads}:/downloads"
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    mem_limit: 1536m
    pids_limit: 256
