name: Publish container images
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without v, for example 0.2.0-preview.1'
        required: true
        type: string
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: publish-container
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || exit 1
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
  validate:
    needs: prepare
    uses: ./.github/workflows/ci.yml
  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/xiatian410/yunx-server
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the native release image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: yunx-release:${{ matrix.arch }}
          build-args: |
            VERSION=${{ env.RELEASE_VERSION }}
            VCS_REF=${{ github.sha }}
          provenance: false
          cache-from: type=gha,scope=release-${{ matrix.arch }}
          cache-to: type=gha,scope=release-${{ matrix.arch }},mode=max
      - name: Validate the shipped Compose and runtime
        run: |
          mkdir -p .work/publish
          python3 scripts/smoke-container.py "yunx-release:$ARCH" "$RELEASE_VERSION" | tee ".work/publish/smoke-$ARCH.json"
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the tested image by revision and architecture
        run: |
          tag="$IMAGE:sha-$GITHUB_SHA-$ARCH"
          docker tag "yunx-release:$ARCH" "$tag"
          docker push "$tag"
          digest=$(docker image inspect "$tag" --format '{{index .RepoDigests 0}}')
          [[ "$digest" == "$IMAGE@sha256:"* ]] || exit 1
          jq -n --arg image "$digest" --arg arch "$ARCH" --arg version "$RELEASE_VERSION" --arg revision "$GITHUB_SHA" '{image:$image,architecture:$arch,version:$version,revision:$revision}' > ".work/publish/digest-$ARCH.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success()
        with:
          name: release-${{ matrix.arch }}
          path: .work/publish/*.json
          include-hidden-files: true
          retention-days: 30
  publish:
    needs: [prepare, validate, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/xiatian410/yunx-server
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: evidence
          merge-multiple: true
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the multi-architecture version
        run: |
          amd64=$(jq -r .image evidence/digest-amd64.json)
          arm64=$(jq -r .image evidence/digest-arm64.json)
          docker buildx imagetools create -t "$IMAGE:$RELEASE_VERSION" -t "$IMAGE:latest" "$amd64" "$arm64"
          docker buildx imagetools inspect "$IMAGE:$RELEASE_VERSION" --raw > evidence/manifest.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('evidence/manifest.json').read_text())
          platforms={(x['platform']['os'],x['platform']['architecture']) for x in manifest['manifests']}
          assert platforms=={('linux','amd64'),('linux','arm64')}, platforms
          for arch in ['amd64','arm64']:
              digest=json.loads(Path(f'evidence/digest-{arch}.json').read_text())['image'].split('@')[1]
              assert any(x['digest']==digest and x['platform']['architecture']==arch for x in manifest['manifests'])
          PY
          docker buildx imagetools inspect "$IMAGE:$RELEASE_VERSION" | tee evidence/image.txt
          echo "Published \`$IMAGE:$RELEASE_VERSION\` and \`$IMAGE:latest\` (amd64 / arm64)." >> "$GITHUB_STEP_SUMMARY"
          echo 'For a new GHCR package, verify public visibility before advertising anonymous pulls.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-manifest
          path: evidence/
          retention-days: 90
